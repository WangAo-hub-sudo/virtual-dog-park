<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Illustration of a Beagle">
  <!-- A simple, flat-style Beagle: white face, black saddle, long floppy ears -->
  <!-- Ground shadow -->
  <ellipse cx="150" cy="265" rx="90" ry="12" fill="#e8e0d4"/>
  <!-- Body -->
  <ellipse cx="150" cy="205" rx="80" ry="45" fill="#f5efe2"/>
  <!-- Black saddle patch on the back -->
  <path d="M110 175 Q150 155 200 180 L205 215 Q160 235 105 215 Z" fill="#3a3a3a"/>
  <!-- Head -->
  <circle cx="150" cy="130" r="48" fill="#f5efe2"/>
  <!-- Tan patches above eyes and on cheeks -->
  <ellipse cx="128" cy="118" rx="12" ry="10" fill="#d9a066"/>
  <ellipse cx="172" cy="118" rx="12" ry="10" fill="#d9a066"/>
  <!-- Long floppy ears -->
  <ellipse cx="108" cy="140" rx="16" ry="34" fill="#8a5a2b"/>
  <ellipse cx="192" cy="140" rx="16" ry="34" fill="#8a5a2b"/>
  <!-- White blaze down the face -->
  <path d="M150 90 L150 165" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="133" cy="128" r="5" fill="#2b2b2b"/>
  <circle cx="167" cy="128" r="5" fill="#2b2b2b"/>
  <circle cx="135" cy="126" r="1.6" fill="#ffffff"/>
  <circle cx="169" cy="126" r="1.6" fill="#ffffff"/>
  <!-- Muzzle and nose -->
  <ellipse cx="150" cy="152" rx="18" ry="13" fill="#ffffff"/>
  <circle cx="150" cy="146" r="7" fill="#2b2b2b"/>
  <!-- Mouth -->
  <path d="M142 160 Q150 166 158 160" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="105" y="225" width="16" height="40" rx="6" fill="#f5efe2"/>
  <rect x="179" y="225" width="16" height="40" rx="6" fill="#f5efe2"/>
  <!-- Tail (curved up) -->
  <path d="M225 195 Q255 175 245 150" stroke="#d9a066" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
