<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Illustration of a Golden Retriever">
  <!-- A simple, flat-style Golden Retriever: warm gold coat, friendly face, feathery tail -->
  <!-- Ground shadow -->
  <ellipse cx="150" cy="265" rx="90" ry="12" fill="#e8e0d4"/>
  <!-- Body -->
  <ellipse cx="150" cy="205" rx="82" ry="46" fill="#e8b96a"/>
  <!-- Chest fluff -->
  <ellipse cx="150" cy="215" rx="34" ry="26" fill="#f4d79b"/>
  <!-- Head -->
  <circle cx="150" cy="128" r="50" fill="#e8b96a"/>
  <!-- Floppy ears (long, feathery) -->
  <path d="M105 110 Q85 150 100 185 Q115 180 118 150 Z" fill="#c98f3e"/>
  <path d="M195 110 Q215 150 200 185 Q185 180 182 150 Z" fill="#c98f3e"/>
  <!-- Eyes -->
  <circle cx="132" cy="126" r="5.5" fill="#2b2b2b"/>
  <circle cx="168" cy="126" r="5.5" fill="#2b2b2b"/>
  <circle cx="134" cy="124" r="1.8" fill="#ffffff"/>
  <circle cx="170" cy="124" r="1.8" fill="#ffffff"/>
  <!-- Friendly eyebrows -->
  <path d="M124 115 Q132 111 140 115" stroke="#a06a24" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M160 115 Q168 111 176 115" stroke="#a06a24" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Muzzle -->
  <ellipse cx="150" cy="152" rx="20" ry="14" fill="#f4d79b"/>
  <circle cx="150" cy="146" r="7.5" fill="#3a2a1a"/>
  <!-- Happy open mouth with tongue -->
  <path d="M138 160 Q150 172 162 160" stroke="#3a2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M146 164 Q150 174 154 164 Z" fill="#e88a8a"/>
  <!-- Legs -->
  <rect x="104" y="225" width="17" height="42" rx="6" fill="#e8b96a"/>
  <rect x="179" y="225" width="17" height="42" rx="6" fill="#e8b96a"/>
  <!-- Feathery tail -->
  <path d="M228 195 Q260 180 255 150" stroke="#f4d79b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M228 195 Q260 180 255 150" stroke="#e8b96a" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
